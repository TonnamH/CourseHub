{% extends "base.html" %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}

<div class="auth-container">
  <div class="auth-left">
    <div class="auth-logo">
        <a href="{% url 'home' %}" class="d-flex align-items-center text-decoration-none text-dark">
            <span>CourseHub</span>
        </a>
    </div>

    <div class="auth-box">
      <h3 class="fw-bold mb-3">Get Started</h3>
      <p class="text-muted mb-4">Start learning today!</p>

      <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <p class="mt-3 text-center small-text">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
      </p>
    </div>
  </div>

  <div class="auth-right d-none d-md-block"></div>
</div>
{% endblock %}
